name: portable Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Release-candidate tags (vX.Y.Z-rc.N) are handled by rc-release.yml.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          Join-Path (go env GOPATH) 'bin' | Add-Content -Encoding utf8 $env:GITHUB_PATH

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          Add-Content -Encoding utf8 $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Validate release tag and product version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = .\scripts\validate-release-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Check release automation contracts
        shell: pwsh
        run: .\scripts\test-release-automation.ps1

      - name: Build and verify portable release assets
        shell: pwsh
        run: |
          .\scripts\build-portable-release.ps1 `
            -Version '${{ steps.version.outputs.version }}'

      - name: Publish portable Windows release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/release/FluxDM-${{ steps.version.outputs.version }}-windows-amd64-portable.exe
            build/release/FluxDM-${{ steps.version.outputs.version }}-windows-amd64-portable.exe.sha256
            build/release/FluxDM-${{ steps.version.outputs.version }}-windows-amd64-portable-browser-integration.zip
            build/release/FluxDM-${{ steps.version.outputs.version }}-windows-amd64-portable-browser-integration.zip.sha256
            build/release/SHA256SUMS.txt
            build/release/release-manifest.json
