name: portable Windows release candidate

on:
  push:
    tags:
      - 'v*-rc.*'

permissions:
  contents: write

jobs:
  release-candidate:
    # This GitHub-hosted runner produces a portable, unsigned test artifact.
    # It has no Authenticode certificate or production signing environment.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          Join-Path (go env GOPATH) 'bin' | Add-Content -Encoding utf8 $env:GITHUB_PATH

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          Add-Content -Encoding utf8 $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Validate release-candidate tag and product version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = .\scripts\validate-rc-release-version.ps1 -Tag $env:RELEASE_TAG
          $productVersion = .\scripts\get-product-version.ps1
          "release_version=$releaseVersion" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          "product_version=$productVersion" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Check release automation contracts
        shell: pwsh
        run: .\scripts\test-release-automation.ps1

      - name: Build and verify portable release-candidate assets
        shell: pwsh
        run: |
          .\scripts\build-portable-release.ps1 `
            -Version '${{ steps.version.outputs.product_version }}' `
            -ReleaseVersion '${{ steps.version.outputs.release_version }}'

      - name: Publish portable release candidate
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: true
          body: |
            ## Portable unsigned release candidate

            This test build is portable: extract the ZIP into a user-writable folder and run FluxDM.exe; it does not install software or require administrator access. It is intentionally **not Authenticode-signed**, so Windows may show a SmartScreen or publisher warning. Verify its SHA-256 against `SHA256SUMS.txt` before using it. FluxDM installs its native browser host automatically; use Settings to open the extension folder, then load it unpacked. Do not treat this prerelease as a production release.
          files: |
            build/release/FluxDM-${{ steps.version.outputs.release_version }}-windows-amd64-portable.zip
            build/release/FluxDM-${{ steps.version.outputs.release_version }}-windows-amd64-portable.zip.sha256
            build/release/SHA256SUMS.txt
            build/release/release-manifest.json
